# نشر على Fly.io:  fly launch --copy-config --no-deploy  ثم  fly deploy
# قبل النشر: fly volumes create coupon_data --size 1
#            fly secrets set ADMIN_PASSWORD=... COUPON_SECRET=...
app = "moshrefoon-coupons"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DB_PATH = "/data/coupons.db"
  TRUST_PROXY = "1"
  # غيّره إلى عنوان تطبيقك الحقيقي قبل توليد أي كوبونات
  PUBLIC_URL = "https://moshrefoon-coupons.fly.dev"

[[mounts]]
  source = "coupon_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
