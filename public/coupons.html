<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الكوبونات — كوبونات المشرفون</title>
<link rel="icon" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="wrap">
    <div class="page-head">
      <div>
        <h1>الكوبونات</h1>
        <p class="sub">كل الكوبونات المولّدة من الموقع وحالتها</p>
      </div>
      <div class="spacer"></div>
      <a class="btn ghost" id="print-link" href="/print" target="_blank" rel="noopener">طباعة النتائج</a>
      <a class="btn" href="/">توليد دفعة جديدة</a>
    </div>

    <section class="card">
      <form id="filters" class="grid cols-4" style="gap:0 14px">
        <label class="field">
          <span class="lbl">بحث برقم الكوبون</span>
          <input type="search" name="q" placeholder="MSH-…" autocomplete="off" style="font-family:var(--mono)">
        </label>
        <label class="field">
          <span class="lbl">الحالة</span>
          <select name="status">
            <option value="">الكل</option>
            <option value="active">صالح</option>
            <option value="used">مستخدم</option>
            <option value="void">ملغى</option>
          </select>
        </label>
        <label class="field">
          <span class="lbl">الدفعة</span>
          <select name="batch"><option value="">كل الدفعات</option></select>
        </label>
        <label class="field">
          <span class="lbl">&nbsp;</span>
          <button class="btn ghost block" type="submit">تطبيق</button>
        </label>
      </form>

      <div id="list"></div>

      <div class="btn-row" style="margin-top:16px;justify-content:center" id="pager" hidden>
        <button class="btn ghost sm" id="prev">السابق</button>
        <span class="help" id="range" style="align-self:center"></span>
        <button class="btn ghost sm" id="next">التالي</button>
      </div>
    </section>
  </div>

  <dialog id="detail" style="border:none;border-radius:16px;padding:0;max-width:560px;width:calc(100% - 32px)">
    <div class="card" style="border:none;box-shadow:none">
      <div class="card-title">
        <h2 id="detail-title">الكوبون</h2>
        <span class="hint"><button class="btn sm ghost" id="close-detail">إغلاق</button></span>
      </div>
      <canvas id="detail-canvas" style="width:100%;height:auto;border-radius:10px"></canvas>
      <div id="detail-body" style="margin-top:14px"></div>
      <div class="btn-row" style="margin-top:16px" id="detail-actions"></div>
    </div>
  </dialog>

  <script type="module" src="/js/coupons.js"></script>
</body>
</html>
